# Config for auto_pokemon_tcgp.py
# Refer to auto_pokemon_tcgp for the complete list of desired_packs
# YAML supports Block-style or Flow-style lists


# Configuration for the desired_booster_packs selection
##  Flow-style lists (uncomment a list to use and comment the other to avoid conflict)

### All Packs
# desired_booster_packs: ["charizard", "mewtwo", "pikachu", "mew", "dialga", "palkia", "arceus", "shiny", "lunala", "solgaleo", "buzzwole", "eevee", "ho-oh", "lugia", "suicune", "deluxe pack ex", "mega altaria", "mega blaziken", "mega gyarados", "crimson blaze", "fantastical parade", "paldean wonders", "mega shine", "pulsing aura"]
### A Series
# desired_booster_packs: ["charizard", "mewtwo", "pikachu", "mew", "dialga", "palkia", "arceus", "shiny", "lunala", "solgaleo", "buzzwole", "eevee", "ho-oh", "lugia", "suicune", "deluxe pack ex"]
### B Series
# desired_booster_packs: ["mega altaria", "mega blaziken", "mega gyarados", "crimson blaze", "fantastical parade", "paldean wonders", "mega shine", "pulsing aura"]

## Block-style list (items must be indented and each item must begin with a hyphen)
desired_booster_packs:
    # - "charizard"
    # - "mewtwo"
    # - "pikachu"
    # - "mew"
    # - "dialga"
    # - "palkia"
    # - "arceus"
    # - "shiny"
    # - "lunala"
    # - "solgaleo"
    # - "buzzwole"
    # - "eevee"
    # - "ho-oh"
    # - "lugia"
    # - "suicune"
    # - "deluxe pack ex"  # limited-time
    # - mega altaria
    # - mega blaziken
    # - mega gyarados
    # - crimson blaze
    # - fantastical parade
    # - paldean wonders
    # - mega shine
    - pulsing aura

# Control flags for various features
debug: true
enable_check_pack_screen: true
enable_wonder_pick: true
enable_special_wonder_picks: true  # special Wonder Picks that uses stamina (e.g., Chansey, Rare)
enable_exit_app: true

# Battle settings
enable_event_battle: true
desired_battle_difficulty: intermediate  # Difficulty choices: beginner, intermediate, advanced, expert
enable_battle_difficulty_fallback: true
battle_check_time: 240  # Seconds to sleep before battle check (0 is False for no sleep)
enable_battle_defeat_redo: true  # Redo battle on defeat
enable_battle_victory_repeat: true  # Repeat battle after victory