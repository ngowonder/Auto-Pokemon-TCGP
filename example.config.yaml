# desired_booster_packs: ["charizard", "mewtwo", "pikachu", "mew", "dialga", "palkia", "arceus", "shiny", "lunala", "solgaleo", "buzzwole", "eevee", "ho-oh", "lugia", "suicune", "deluxe pack ex", "mega altaria", "mega blaziken", "mega gyarados", "crimson blaze", "fantastical parade", "paldean wonders", "mega shine", "pulsing aura", "paradox drive", "everyday wonders", "ruler of the skies", "team_rockets_ambition"]
